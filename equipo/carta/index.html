<style>

const STOPW=new Set(["de","la","el","los","las","con","del","sin","una","por","y","o","en","a","al","salsa","anos","años","x"]);
const sigw=n=>norm(n).replace(/\(.*?\)/g," ").split(/[^a-z0-9ñ]+/).filter(w=>w.length>=3&&!STOPW.has(w));
function obvious(q){if(/^Un cliente pregunta por un cóctel|^¿Qué plato es\?/.test(q.q)){const qq=norm(q.q);return sigw(q.a).some(w=>qq.includes(w))}if(!q.sub)return false;const ws=sigw(q.sub);const a=norm(q.a);return ws.some(w=>new RegExp("(^|[^a-z])"+w+"([^a-z]|$)").test(a))}
function maskName(t,n){const ws=sigw(n).concat(norm(n).split(/\s+/).filter(w=>/^\d+$/.test(w)));return t.replace(/[\p{L}\d]+/gu,m=>ws.includes(norm(m))?"___":m)}
function buildQuiz(m){
  const pool=POOL[m.t];const n=m.exam?15:Math.min(10,Math.max(5,m.items.length*2));
  let all=[];shuf(m.items).forEach(x=>{const q=(x.isCat?catQ(x.c):genQ(x,m.t,pool).map(z=>Object.assign(z,{sub:z.sub||x.n}))).filter(z=>!obvious(z)||/^¿Qué es esto\?|^¿De qué trago|^¿De cuál licor|^Un cliente pide/.test(z.q));all.push(shuf(q))});

  const out=[];let round=0;while(out.length<n&&all.some(a=>a.length)){all.forEach(a=>{if(out.length<n&&a.length)out.push(a.shift())});round++}

}

      ${L.map(x=>`<tr><td><b>${esc(x.n)}</b>${x.sedes.length===1?` <span class="only">· Solo ${SEDE[x.sedes[0]]}</span>`:""}${x.origen||x.l?`<span class="nt">${esc(x.origen||"")}${x.l?" · "+esc(x.l):""}</span>`:""}</td><td>${esc(x.b)}</td><td>${esc(x.m)}</td><td>${esc(x.s)}</td></tr>`).join("")}</tbody></table></div>`});
    if(!any)h+=`<p class="empty">No hay resultados.</p>`;
  }

}
function openIt(key){
  const [k,id]=key.split(":");const x=DATA[k].find(y=>y.id===id);if(!x)return;
  if(typeof cardHTML==="function"){$("sb").innerHTML=`<button class="x" id="cl" aria-label="Cerrar">✕</button>`+cardHTML({t:k},x).replace('<div class="lcard">','<div class="lcard" style="margin:0;border:0;border-radius:0">');$("sh").classList.add("on");document.body.style.overflow="hidden";$("sb").scrollTop=0;$("cl").onclick=close;return}
  let h=`<button class="x" id="cl" aria-label="Cerrar">✕</button>${x.img?`<img src="${x.img}" alt="">`:""}<div class="in"><h3>${esc(x.n)}</h3>
  <div><span class="tag" style="background:#3a1424;color:#ffb3cb">${esc(x.cat)}</span> <span class="tag">${x.sedes.map(s=>SEDE[s]).join(" y ")}</span></div>`;
  if(x.d)h+=`<p>${esc(x.d)}</p>`;
  if(k==="coc"){
    if(x.ins&&x.ins.length)h+=`<div class="k">Lleva</div><ul>${x.ins.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
    if(x.op&&x.op.length)h+=`<div class="k">Opciones</div><p style="margin-top:4px">${x.op.map(esc).join(" · ")}</p>`;
    if(x.vaso)h+=`<div class="k">Se sirve en</div><p style="margin-top:4px">${esc(x.vaso)}</p>`;
    if(x.g)h+=`<div class="k">Decoración</div><p style="margin-top:4px">${esc(x.g)}</p>`;
  }
  h+=`</div>`;$("sb").innerHTML=h;$("sh").classList.add("on");document.body.style.overflow="hidden";$("sb").scrollTop=0;$("cl").onclick=close;
}
function close(){$("sh").classList.remove("on");document.body.style.overflow=""}
$("sh").onclick=e=>{if(e.target.id==="sh")close()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{T=b.dataset.t;VIEW="home";try{sessionStorage.setItem("ct",T)}catch(e){}render();scrollTo(0,0)});

}

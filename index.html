<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La House - Servicio Pro</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La House">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0912;--bg2:#141020;--card:#1b1530;--card2:#231b3d;--line:#2f2650;
  --tx:#f3f0fa;--mut:#a59fbd;--pink:#ff3d9a;--cyan:#22e1ff;--gold:#ffc83d;--green:#3ddc84;--red:#ff5a5f;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Poppins',system-ui,sans-serif;min-height:100%}
body{background:radial-gradient(1000px 500px at 80% -10%,#3a1450 0%,transparent 60%),radial-gradient(800px 400px at -10% 10%,#0d3550 0%,transparent 55%),var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.app{max-width:560px;margin:0 auto;padding:18px 16px 110px;min-height:100vh}
h1,h2,.disp{font-family:'Lilita One',sans-serif;letter-spacing:1px;font-weight:400}
h1{font-size:44px;line-height:.95}
h2{font-size:30px;margin:6px 0 12px}
h3{font-size:16px;font-weight:700;margin-bottom:6px}
p{line-height:1.55;color:#ddd8ec}
.mut{color:var(--mut);font-size:13px}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:15px;background:linear-gradient(90deg,var(--pink),#b34dff);box-shadow:0 6px 24px #ff3d9a44;width:100%;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.btn.cy{background:linear-gradient(90deg,#00b8ff,var(--cyan));color:#06121a;box-shadow:0 6px 24px #22e1ff33}
.btn.gold{background:linear-gradient(90deg,#ff9f1c,var(--gold));color:#1a1200}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.pill.on{background:#ff3d9a22;border-color:var(--pink);color:#ff9ccb}
.bar{height:10px;background:#ffffff12;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:99px;transition:width .5s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-family:'Lilita One';font-size:26px;letter-spacing:2px}
.brand b{color:var(--pink)}
.xpchip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.hero{position:relative;overflow:hidden}
.hero .lvl{font-family:'Lilita One';font-size:34px}
.medal{font-size:46px}
.stat{text-align:center;padding:12px 6px}
.stat b{display:block;font-size:22px;font-family:'Lilita One';letter-spacing:1px}
.stat span{font-size:11px;color:var(--mut)}
.mod{display:flex;gap:14px;align-items:center;cursor:pointer}
.mod .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--card2);flex:none}
.mod .bd{flex:1;min-width:0}
.mod .bd .bar{height:6px;margin-top:8px}
.done{color:var(--green);font-weight:700;font-size:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0912ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;background:none;padding:10px 0 12px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .e{font-size:21px;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--tx)}
.nav button.on .e{filter:none;opacity:1}
.back{background:none;color:var(--mut);font-size:14px;margin-bottom:10px;padding:4px 0}
.lesson{min-height:300px;display:flex;flex-direction:column}
.lesson .num{font-family:'Lilita One';font-size:16px;color:var(--cyan);letter-spacing:2px}
.lesson ul{margin:10px 0 0 18px}
.lesson li{margin:6px 0;line-height:1.5;color:#ddd8ec}
.tip{margin-top:14px;padding:12px 14px;border-radius:12px;background:#22e1ff14;border:1px solid #22e1ff44;font-size:14px}
.tip b{color:var(--cyan)}
.say{margin-top:10px;padding:12px 14px;border-left:3px solid var(--pink);background:#ff3d9a10;border-radius:0 12px 12px 0;font-style:italic;font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:7px;height:7px;border-radius:99px;background:#ffffff25}
.dots i.on{background:var(--pink);width:20px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:8px 0;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:15px;line-height:1.4}
.opt.ok{background:#3ddc8422;border-color:var(--green)}
.opt.bad{background:#ff5a5f22;border-color:var(--red)}
.opt.mid{background:#ffc83d1c;border-color:var(--gold)}
.fb{padding:12px 14px;border-radius:12px;margin:10px 0;font-size:14px;line-height:1.5}
.fb.ok{background:#3ddc8418;border:1px solid #3ddc8455}
.fb.bad{background:#ff5a5f18;border:1px solid #ff5a5f55}
.fb.mid{background:#ffc83d14;border:1px solid #ffc83d55}
.big{font-family:'Lilita One';font-size:64px;line-height:1;text-align:center}
.center{text-align:center}
.lb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:8px;background:var(--card);border:1px solid var(--line)}
.lb.me{border-color:var(--pink);background:#ff3d9a14}
.lb .pos{font-family:'Lilita One';font-size:24px;width:28px;text-align:center}
.lb .av{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;font-weight:700;background:var(--card2)}
.badge{text-align:center;padding:14px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.badge .e{font-size:32px}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge b{display:block;font-size:12px;margin-top:6px}
.badge span{font-size:10px;color:var(--mut)}
input,select{width:100%;padding:14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-family:inherit;font-size:15px;margin:6px 0 14px}
label{font-size:13px;color:var(--mut)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.roles button{padding:14px 8px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.roles button.on{border-color:var(--pink);background:#ff3d9a22}
.timer{font-family:'Lilita One';font-size:40px;color:var(--gold)}
.ticket{font-family:'Lilita One';font-size:22px;color:var(--green)}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--card2);border:1px solid var(--pink);padding:12px 18px;border-radius:14px;z-index:50;font-weight:600;transition:transform .35s;max-width:90vw;text-align:center;box-shadow:0 10px 40px #0008}
.toast.show{transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:-20px;font-size:22px;z-index:40;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.sheet h3{color:var(--gold);margin-top:6px}
.sheet ol,.sheet ul{margin:6px 0 4px 20px}
.sheet li{margin:5px 0;line-height:1.45;font-size:14px;color:#ddd8ec}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{flex:none;padding:8px 14px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.tabs button.on{color:var(--tx);border-color:var(--cyan);background:#22e1ff1a}
.lock{opacity:.45}
.kpi{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kpi:last-child{border:none}
.glow{position:absolute;width:180px;height:180px;border-radius:99px;filter:blur(60px);opacity:.35;right:-40px;top:-60px;background:var(--pink)}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:12px 2px;color:var(--tx);font:inherit;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chk:last-child{border-bottom:none}
.chk .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#0b0912}
.chk.on .box{background:var(--cyan);border-color:var(--cyan)}
.chk.on .tx{color:var(--mut)}

[data-act]{cursor:pointer;-webkit-tap-highlight-color:rgba(255,255,255,.08)}
[data-act] *{pointer-events:none}
[data-act] button,[data-act] a{pointer-events:auto}

.deep{margin:0 0 16px}.deep:last-child{margin-bottom:0}.deep h4{font-size:16px;margin:0 0 6px;color:var(--cyan)}.deep p{font-size:15px;line-height:1.6;margin:0}

/* Marca La House (estilo de lahousemed.com) */
:root{--bg:#07041a;--bg2:#120a3a;--card:#160e45;--card2:#22155e;--line:#ffffff2e;--pink:#ff1c74;--cyan:#00f0f5;--gold:#ffe600;--purple:#9b00d9;--blue:#5b6cff;--mut:#c9c3ea}
html,body{font-family:'Poppins',system-ui,sans-serif}
body{background:linear-gradient(180deg,#07041acc 0%,#0b0630e6 35%,#07041af2 100%),url(bg-neon.jpg) center top/cover fixed,var(--bg)}
.card{background:linear-gradient(160deg,#1d1260d9,#0e0835e6);border:1px solid var(--line);box-shadow:0 8px 30px #0006;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
h1,h2{font-family:'Lilita One',sans-serif;font-weight:400;letter-spacing:.5px}
.btn{background:linear-gradient(90deg,var(--pink),var(--purple));box-shadow:0 6px 24px #ff1c7455;font-weight:800}
.btn.gold{background:var(--gold);color:#140f00;box-shadow:0 6px 0 #c9a800,0 10px 26px #ffe60033}
.btn.cy{background:var(--cyan);color:#04161a}
.bar>i{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--pink))}
.top{background:#000;margin:-16px -16px 14px;padding:14px 16px 12px;border-bottom:1px solid #ffffff14}
.top .brand{font-size:0;width:150px;height:38px;background:url(logo-head.png) left center/contain no-repeat}
.nav{background:#000!important;border-top:1px solid #ffffff1a}
input,select{background:#0c0730;border-color:#ffffff33}
#gate{padding-top:0!important}
#gate .hero{position:relative;margin:0 -18px 0;height:200px;background:url(neon.svg) center/88% no-repeat,radial-gradient(circle at 50% 55%,#3a1b8a 0%,#07041a 70%)}
#gate .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#07041a 100%)}
#gate .tag{text-align:center;font-weight:800;font-size:17px;line-height:1.35;margin:4px 0 2px}
#gate .tag2{text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;color:var(--gold);text-shadow:2px 2px 0 var(--pink);margin-bottom:8px}

/* Personalización extra: títulos tipo grafiti, neón y cinta */
.lhw{display:inline-block}
.lht{font-family:'Lilita One',sans-serif!important;letter-spacing:1px;-webkit-text-stroke:1.2px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000,0 0 14px #ffffff22}
.lht .c0{color:var(--pink)}.lht .c1{color:var(--gold)}.lht .c2{color:#b84dff}.lht .c3{color:var(--cyan)}
.lh-marquee{overflow:hidden;white-space:nowrap;margin:-14px -16px 14px;background:linear-gradient(90deg,var(--pink),var(--purple),#3a2bd6,var(--cyan));padding:7px 0;font-weight:800;font-size:13px;letter-spacing:1px;color:#fff;text-shadow:1px 1px 0 #0008}
.lh-marquee span{display:inline-block;padding-left:100%;animation:lhm 26s linear infinite}
@keyframes lhm{to{transform:translateX(-100%)}}
.card{border-radius:20px}
.card[data-act]{transition:transform .12s,box-shadow .2s}
.card[data-act]:active{transform:scale(.98)}
.card:nth-of-type(4n+1){box-shadow:0 0 0 1px #ff1c7433,0 8px 30px #0006,0 0 22px #ff1c7422}
.card:nth-of-type(4n+2){box-shadow:0 0 0 1px #00f0f533,0 8px 30px #0006,0 0 22px #00f0f522}
.card:nth-of-type(4n+3){box-shadow:0 0 0 1px #b84dff44,0 8px 30px #0006,0 0 22px #b84dff22}
.card:nth-of-type(4n){box-shadow:0 0 0 1px #ffe60033,0 8px 30px #0006,0 0 22px #ffe60018}
.pill{font-weight:800;border-width:2px;box-shadow:2px 2px 0 #000}
.nav button{position:relative}
.nav button.on:after{content:"";position:absolute;left:28%;right:28%;bottom:2px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--pink),var(--cyan));box-shadow:0 0 10px var(--pink)}
.toast{border:2px solid var(--gold);box-shadow:0 0 24px #ffe60044}
.opt{border-radius:16px}
.opt.ok{box-shadow:0 0 18px #3ddc8455}
#gate .ready{text-align:center;margin:10px 0 0;font-family:'Lilita One',sans-serif;font-size:26px;-webkit-text-stroke:1px #000;paint-order:stroke fill;text-shadow:3px 3px 0 #000}
.card.lh-neon{border:2px solid transparent;background:linear-gradient(160deg,#120a3a,#07041a) padding-box,linear-gradient(90deg,var(--pink),#3a7bff,var(--purple),var(--pink)) border-box;box-shadow:0 0 16px #ff1c7466,0 0 34px #3a7bff40}
body:before{content:"";position:fixed;right:-60px;top:120px;width:320px;height:176px;background:url(neon.svg) center/contain no-repeat;opacity:.16;pointer-events:none;z-index:0;transform:rotate(-8deg)}
.app{position:relative;z-index:1}
.lh-photo{position:relative;height:150px;border-radius:20px;overflow:hidden;margin:0 0 12px;background:url(fachada.jpg) center 40%/cover;box-shadow:0 8px 26px #0008}
.lh-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#07041ae6 100%)}
.lh-photo b{position:absolute;left:14px;right:14px;bottom:10px;z-index:1;font-size:21px}
.roles button{text-align:left}
.lock{opacity:.45}
.inp{margin:4px 0 10px}
#gate{max-width:440px;margin:0 auto;padding:48px 18px 30px}
#gate .logo{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:2px;text-align:center;line-height:1}
#gate .logo span{display:block;font-family:'Lilita One',sans-serif;font-size:34px;color:#fff;letter-spacing:2px;text-shadow:3px 3px 0 var(--pink),-1px -1px 0 #000}
#gate label{font-size:13px;color:var(--mut)}
#gate .err{color:var(--red);margin-top:10px;min-height:20px}
</style>
</head>
<body>
<div id="gate"></div>
<div class="app" id="app"></div>
<nav class="nav" id="nav" style="display:none"><div class="in">
  <button data-v="home"><span class="e">🏠</span>Inicio</button>
  <button data-v="learn"><span class="e">📚</span>Aprender</button>
  <button data-v="sim"><span class="e">🎭</span>Simular</button>
  <button data-v="rank"><span class="e">🏆</span>Ranking</button>
  <button data-v="me"><span class="e">👤</span>Perfil</button>
  <button data-v="lead" id="navlead" style="display:none"><span class="e">📊</span>Líder</button>
</div></nav>
<div class="toast" id="toast"></div>
<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CONFIG={"apiKey": "AIzaSyBYALdajSTvkyBiKIQobsQyNLhapFUYINo", "authDomain": "la-house-service-pro.firebaseapp.com", "projectId": "la-house-service-pro", "storageBucket": "la-house-service-pro.firebasestorage.app", "messagingSenderId": "49435128726", "appId": "1:49435128726:web:0978e5ca2fa46a5ee7a3b7"};
const ADMIN_EMAILS=["machado.rarm@gmail.com"];
const DOMAIN="staff.lahouse.app";
const STATE_KEY="nightpro_v2";
const CHUNK=450000;

const fb=initializeApp(CONFIG);const auth=getAuth(fb);const db=getFirestore(fb);
const gate=document.getElementById("gate");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toEmail=u=>{u=String(u||"").trim().toLowerCase();return u.includes("@")?u:u.replace(/\s+/g,"")+"@"+DOMAIN};
const show=html=>{gate.style.display="";gate.innerHTML=`<div style="background:#000;margin:0 -18px;padding:18px 18px 14px;text-align:center"><img src="logo-head.png" alt="La House" style="height:44px"></div><div class="hero"></div><div class="logo" style="margin-top:6px"><span>SERVICIO PRO</span></div><div class="tag">La app de entrenamiento del equipo.</div><div class="tag2">¡Hoy la fiesta la haces tú!</div>`+html};
let started=false;

function loginForm(msg){
  show(`<div class="card" style="margin-top:26px"><h2 style="margin-bottom:12px">Entrar</h2>
  <label>Usuario</label><input id="lgU" autocomplete="username" autocapitalize="none" placeholder="Ej: ana.lopez">
  <label>Clave</label><input id="lgP" type="password" autocomplete="current-password">
  <button class="btn gold" id="lgGo">Entrar</button><div class="err" id="lgE">${esc(msg||"")}</div></div>
  <div class="card" style="text-align:center"><b>¿Primera vez?</b><p class="mut" style="margin:4px 0 10px">Crea tu cuenta y tu líder te aprueba.</p><button class="btn" id="lgNew">Crear mi cuenta</button></div>`);
  document.getElementById("lgNew").onclick=()=>signupForm();
  const go=async()=>{const u=document.getElementById("lgU").value,p=document.getElementById("lgP").value,e=document.getElementById("lgE");
    if(!u||!p){e.textContent="Escribe tu usuario y tu clave.";return}
    e.textContent="Entrando…";document.getElementById("lgGo").disabled=true;
    try{await signInWithEmailAndPassword(auth,toEmail(u),p)}
    catch(err){const c=err&&err.code||"";e.textContent=c.includes("too-many")?"Demasiados intentos. Espera unos minutos.":c.includes("network")?"Sin conexión a internet. Revisa tu señal.":"Usuario o clave incorrectos.";document.getElementById("lgGo").disabled=false}};
  document.getElementById("lgGo").onclick=go;
  document.getElementById("lgP").onkeydown=ev=>{if(ev.key==="Enter")go()};
}
function blocked(title,text){show(`<div class="card center" style="margin-top:26px;text-align:center"><div style="font-size:52px">🚫</div><h2 style="margin:8px 0">${esc(title)}</h2><p class="mut">${esc(text)}</p><button class="btn" id="lgOut" style="margin-top:14px">Salir</button></div>`);
  document.getElementById("lgOut").onclick=()=>signOut(auth).then(()=>location.reload())}


const ROLE_LIST=[["sc","Asesor de servicio"],["bt","Bartender"],["co","Cocinero(a)"],["cj","Cajero(a)"],["ho","Host"],["cv","Cover"],["le","Líder de turno"]];
const slugU=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g,".").replace(/[^a-z0-9.@_-]/g,"");
let signingUp=false;
function profileFields(){return `<label>Nombre y apellido</label><input id="rgN" autocomplete="name" placeholder="Ej: Ana López">
  <label>Cargo</label><select id="rgR">${ROLE_LIST.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join("")}</select>`}
function signupForm(){
  show(`<div class="card" style="margin-top:26px"><h2 style="margin-bottom:12px">Crear mi cuenta</h2>${profileFields()}
  <label>Usuario (con este entras)</label><input id="rgU" autocomplete="username" autocapitalize="none" placeholder="Ej: ana.lopez">
  <label>Contraseña (mínimo 6 caracteres)</label><input id="rgP" type="password" autocomplete="new-password">
  <label>Repite la contraseña</label><input id="rgP2" type="password" autocomplete="new-password">
  <button class="btn gold" id="rgGo">Crear cuenta</button><div class="err" id="rgE"></div></div>

  document.getElementById("rgBack").onclick=ev=>{ev.preventDefault();loginForm()};
  document.getElementById("rgGo").onclick=async()=>{const e=document.getElementById("rgE");
    const name=nm.value.trim(),role=document.getElementById("rgR").value,u=slugU(us.value),p=document.getElementById("rgP").value,p2=document.getElementById("rgP2").value;
    if(!name||!u){e.textContent="Escribe tu nombre y un usuario.";return}

    e.style.color="var(--mut)";e.textContent="Creando tu cuenta…";document.getElementById("rgGo").disabled=true;signingUp=true;
    try{const cr=await createUserWithEmailAndPassword(auth,toEmail(u),p);
      if(!ADMIN_EMAILS.includes(toEmail(u)))await setDoc(doc(db,"staff",cr.user.uid),{name,role,user:u,active:false,pending:true,self:true,created:new Date().toISOString()});
      signingUp=false;started=false;start(cr.user)}
    catch(err){signingUp=false;const c=err&&err.code||"";e.style.color="";document.getElementById("rgGo").disabled=false;

}

  const off=onSnapshot(doc(db,"staff",user.uid),sn=>{const d=sn.data();if(d&&d.active){off();started=false;start(user)}else if(d&&!d.pending&&!d.active){off();blocked("No tienes acceso","Tu solicitud no fue aprobada. Si crees que es un error, habla con tu líder.")}},()=>{});

async function readContent(){
  const meta=await getDoc(doc(db,"content","meta"));
  if(!meta.exists())return null;
  const m=meta.data();let cached=null;
  try{if(localStorage.getItem("lh_cv")===m.version)cached=localStorage.getItem("lh_c")}catch(e){}
  if(cached)return {v:m.version,js:cached};
  const parts=[];for(let i=0;i<m.parts;i++){const s=await getDoc(doc(db,"content","p"+i));parts.push(s.data().t)}
  const js=parts.join("");
  try{localStorage.setItem("lh_c",js);localStorage.setItem("lh_cv",m.version)}catch(e){try{localStorage.removeItem("lh_c");localStorage.removeItem("lh_cv")}catch(_){}}
  return {v:m.version,js};
}
async function uploadText(txt){
  let o;try{o=JSON.parse(txt)}catch(e){throw new Error("El archivo no es un contenido válido.")}
  if(!o||o.app!=="la-house-servicio-pro"||typeof o.js!=="string"||!o.version)throw new Error("Ese archivo no es el contenido de la app.");
  const n=Math.ceil(o.js.length/CHUNK);
  for(let i=0;i<n;i++)await setDoc(doc(db,"content","p"+i),{t:o.js.slice(i*CHUNK,(i+1)*CHUNK)});
  await setDoc(doc(db,"content","meta"),{version:o.version,parts:n,updated:new Date().toISOString()});
  try{localStorage.removeItem("lh_c");localStorage.removeItem("lh_cv")}catch(e){}
  return o.version;
}
async function uploadContent(file){return uploadText(await file.text())}
async function uploadFromSite(pass){
  pass=String(pass||"").trim();if(!pass)throw new Error("Escribe la clave de contenido.");
  let r;try{r=await fetch("contenido.enc?t="+Date.now(),{cache:"no-store"})}catch(e){throw new Error("Sin conexión a internet.")}
  if(!r.ok)throw new Error("No encontré el archivo contenido.enc en GitHub. Revisa que lo hayas subido.");
  const o=await r.json();const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(o.s),iterations:o.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  let pt;try{pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(o.iv)},key,b(o.ct))}catch(e){throw new Error("La clave de contenido no es correcta.")}
  return uploadText(new TextDecoder().decode(pt));
}
function uploadScreen(){
  show(`<div class="card" style="margin-top:26px"><h2>📦 Carga el contenido</h2><p class="mut" style="margin:8px 0 14px">La app todavía no tiene lecciones. Escribe la <b>clave de contenido</b> que te di en el chat y toca cargar. Solo se hace una vez; después tus empleados lo reciben solo.</p>
  <label>Clave de contenido</label><input id="upK" autocomplete="off" autocapitalize="none" placeholder="Ej: casa-ruta-1234">
  <button class="btn gold" id="upS">Cargar contenido</button><div class="err" id="upE"></div>
  <p class="mut" style="font-size:13px;margin-top:14px">¿Tienes el archivo .json? <a href="#" id="upB" style="color:var(--gold)">Elegir archivo</a></p>
  <input type="file" id="upF" accept=".json,application/json" style="display:none">
  <button class="btn" id="lgOut" style="margin-top:14px;background:var(--card)">Salir</button></div>`);
  const e=document.getElementById("upE");
  const run=async fn=>{e.style.color="var(--mut)";e.textContent="Cargando… puede tardar un minuto.";document.getElementById("upS").disabled=true;
    try{await fn();location.reload()}catch(err){e.style.color="";e.textContent=err.message||"No se pudo cargar.";document.getElementById("upS").disabled=false}};
  document.getElementById("upS").onclick=()=>run(()=>uploadFromSite(document.getElementById("upK").value));
  document.getElementById("upB").onclick=ev=>{ev.preventDefault();document.getElementById("upF").click()};
  document.getElementById("upF").onchange=ev=>{const f=ev.target.files[0];if(f)run(()=>uploadContent(f))};
  document.getElementById("lgOut").onclick=()=>signOut(auth).then(()=>location.reload());
}
function makeAdapter(uid,isAdmin,staffName){
  const snapDoc=d=>({id:d.id,data:()=>d.data()});
  const dbApi={
    doc:p=>{const r=doc(db,...p.split("/"));return{
      get:async()=>{const s=await getDoc(r);return{exists:s.exists(),data:()=>s.data()}},
      set:async v=>setDoc(r,v),update:async v=>setDoc(r,v,{merge:true}),delete:async()=>deleteDoc(r)}},
    collection:p=>({onSnapshot:(cb,err)=>onSnapshot(collection(db,...p.split("/")),sn=>{
      const docs=sn.docs.filter(d=>{const x=d.data();return x&&!x.inactive}).map(snapDoc);
      const approved={};docs.forEach(d=>approved[d.id]=true);approved[uid]=true;
      docs.push({id:"_acceso",data:()=>({approved,blocked:{}})});
      cb({metadata:{fromCache:sn.metadata.fromCache},docs})},e=>err&&err(e))})
  };
  const userApi={id:async()=>uid,me:async()=>({id:uid}),isOwner:async()=>isAdmin,canEdit:async()=>isAdmin,can:async()=>true,
    profiles:async ids=>{const o={};ids.forEach(i=>o[i]={name:""});return o}};
  return {use:async n=>n==="db"?dbApi:n==="user"?userApi:null};
}

async function start(user){
  if(started)return;started=true;
  show(`<p class="mut" style="text-align:center;margin-top:40px">Cargando…</p>`);
  const isOwner=ADMIN_EMAILS.includes(String(user.email||"").toLowerCase());
  let isAdmin=isOwner;
  let staff=null;
  try{
    if(!isOwner){const s=await getDoc(doc(db,"staff",user.uid));staff=s.exists()?s.data():null;
      if(!staff){started=false;completeForm(user);return}
      if(!staff.active&&staff.pending){started=false;pendingScreen(user,staff);return}
      if(!staff.active){started=false;blocked("No tienes acceso","Tu usuario está desactivado. Si crees que es un error, habla con tu líder.");return}
      isAdmin=staff.admin===true}
  }catch(e){if(!isAdmin){started=false;blocked("Sin conexión","No pudimos verificar tu acceso. Revisa tu internet e intenta de nuevo.");return}}
  let c=null;
  try{c=await readContent()}catch(e){try{const js=localStorage.getItem("lh_c");if(js)c={v:localStorage.getItem("lh_cv"),js}}catch(_){}}
  if(!c){if(isAdmin){uploadScreen()}else{started=false;blocked("La app aún no está lista","Todavía no se ha cargado el contenido. Avísale a tu líder.")}return}
  // estado local por usuario (por si varios usan el mismo celular)
  try{if(localStorage.getItem("lh_uid")!==user.uid){localStorage.removeItem(STATE_KEY);localStorage.setItem("lh_uid",user.uid)}
    const raw=localStorage.getItem(STATE_KEY);const st=raw?JSON.parse(raw):{v:2};
    if(!st.name){st.v=2;st.name=isOwner?"Administrador":(staff&&staff.name||"");st.role=isOwner?"le":(staff&&staff.role||"");localStorage.setItem(STATE_KEY,JSON.stringify(st))}}catch(e){}
  window.LH={contentVersion:c.v,appUrl:location.origin+location.pathname,isAdmin,isOwner,
    setAdmin:async(id,on)=>{const r=doc(db,"staff",id);const x=await getDoc(r);await setDoc(r,Object.assign({},x.data(),{admin:on}))},
    reject:async id=>{const r=doc(db,"staff",id);const x=await getDoc(r);await setDoc(r,Object.assign({},x.data(),{active:false,pending:false}))},
    logout:()=>signOut(auth).then(()=>{try{localStorage.removeItem(STATE_KEY);localStorage.removeItem("lh_uid")}catch(e){}location.reload()}),
    uploadContent,uploadFromSite,
    listStaff:async()=>{const s=await getDocs(collection(db,"staff"));return s.docs.map(d=>Object.assign({id:d.id},d.data()))},
    createStaff:async({name,role,user:u,pass})=>{
      const email=toEmail(u);const sec=initializeApp(CONFIG,"alta-"+Date.now());const a2=getAuth(sec);
      try{const cr=await createUserWithEmailAndPassword(a2,email,pass);
        await setDoc(doc(db,"staff",cr.user.uid),{name,role,user:u,pass,active:true,created:new Date().toISOString()});
        await signOut(a2)}
      catch(e){const c=e&&e.code||"";throw new Error(c.includes("email-already")?"Ese usuario ya existe. Usa otro.":c.includes("weak-password")?"La clave es muy corta (mínimo 6 caracteres).":"No se pudo crear: "+(e.message||c))}
      finally{try{await deleteApp(sec)}catch(_){}}},
    setActive:async(id,on)=>{const r=doc(db,"staff",id);const s=await getDoc(r);await setDoc(r,Object.assign({},s.data(),{active:on,pending:false}));
      await setDoc(doc(db,"team",id),{inactive:!on},{merge:true})}
  };
  window.claude=makeAdapter(user.uid,isAdmin,staff&&staff.name);
  if(!isOwner&&staff){try{setDoc(doc(db,"servicepro_visitas",user.uid),{name:staff.name||"",role:staff.role||"",last:new Date().toISOString(),n:increment(1)},{merge:true}).catch(()=>{})}catch(_){}}
  if(isAdmin){try{lhVisitasBtn()}catch(_){}}
  gate.style.display="none";gate.innerHTML="";document.getElementById("nav").style.display="";
  const s=document.createElement("script");s.text=c.js;document.body.appendChild(s);
}

async function lhVisitas(){
  const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;z-index:9999;background:#0B0B0B;color:#f5f5f5;overflow-y:auto;font-family:system-ui,sans-serif";
  o.innerHTML='<div style="max-width:640px;margin:auto;padding:18px 16px 60px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:22px">Entradas a Servicio Pro</h2><button id="lhvx" style="background:#1d1d1d;border:1px solid #333;color:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer">×</button></div><p style="color:#a8a8a8">Cargando…</p></div>';
  document.body.appendChild(o);o.querySelector("#lhvx").onclick=()=>o.remove();
  const box=o.firstChild;let staff=[],vis={},ok=true;
  try{const s=await getDocs(collection(db,"staff"));staff=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.name&&x.active)}catch(e){}
  try{const v=await getDocs(collection(db,"servicepro_visitas"));v.docs.forEach(d=>vis[d.id]=d.data())}catch(e){ok=false}
  const when=iso=>{const d=new Date(iso),n=new Date();const hm=d.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
    const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());const dd=Math.round((day(n)-day(d))/864e5);
    return dd===0?"hoy "+hm:dd===1?"ayer "+hm:dd<7?"hace "+dd+" días":d.toLocaleDateString("es-CO",{day:"numeric",month:"short"})};
  staff.sort((a,b)=>String((vis[b.id]||{}).last||"").localeCompare(String((vis[a.id]||{}).last||"")));
  const row=s=>{const v=vis[s.id];return `<div style="background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin-bottom:10px"><b>${esc(s.name)}</b><span style="color:#a8a8a8"> · ${esc(s.role||"")}</span>
    <div style="margin-top:4px;font-size:14px;color:${v&&v.last?"#73F7FB":"#FF7EA6"}">${v&&v.last?`Última vez: <b>${when(v.last)}</b> · entró ${v.n||1} ${(v.n||1)===1?"vez":"veces"}`:"Nunca ha entrado (desde que se activó el registro)"}</div></div>`};
  box.innerHTML=box.innerHTML.replace('<p style="color:#a8a8a8">Cargando…</p>',(ok?'':'<p style="color:#FF7EA6">No pude leer las entradas. Falta activar la regla de visitas en Firebase.</p>')+`<p style="color:#a8a8a8">${staff.length} personas activas</p>`+staff.map(row).join(""));
  o.querySelector("#lhvx").onclick=()=>o.remove()}

// Decoración de marca: títulos de colores y cinta con frases
const LH_COLORS=4;
function lhColor(el){if(el.dataset.lhd)return;el.dataset.lhd="1";const t=el.textContent;if(!t||t.length>40||el.children.length)return;
  let i=0;el.innerHTML=t.split(/(\s+)/).map(w=>/^\s+$/.test(w)?w:`<span class="lhw">${[...w].map(ch=>`<span class="c${(i++)%LH_COLORS}">${esc(ch)}</span>`).join("")}</span>`).join("");el.classList.add("lht")}
function lhDecorate(){const app=document.getElementById("app");if(!app)return;
  app.querySelectorAll("h1,h2,.lvl").forEach(lhColor);
  if(!app.querySelector(".lh-marquee")){const top=app.querySelector(".top");if(top){const m=document.createElement("div");m.className="lh-marquee";
    m.innerHTML="<span>★ HOY LA FIESTA LA HACES TÚ ★ CADA MESA, UNA EXPERIENCIA ★ SONRISA, RITMO Y ACTITUD ★ EL CLIENTE SE VA FELIZ Y VUELVE ★ EQUIPO LA HOUSE ★</span>";top.after(m)}}
  let v="";try{v=view}catch(e){}
  const f=app.querySelector(".fade");if(f){const c=f.querySelector(".card");if(c&&!c.classList.contains("lh-neon")&&(v==="home"||v==="me"||v==="rank"))c.classList.add("lh-neon")}
  if(v==="home"&&!app.querySelector(".lh-photo")){const m=app.querySelector(".lh-marquee");if(m){const ph=document.createElement("div");ph.className="lh-photo";ph.innerHTML='<b class="lht" data-lhd="1">'+[..."¡Hoy la fiesta la haces tú!"].map((ch,i)=>ch===" "?" ":`<span class="c${i%4}">${ch}</span>`).join("")+'</b>';m.after(ph)}}
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.classList.contains("on")||b.getAttribute("aria-current")==="page"))}
new MutationObserver(()=>lhDecorate()).observe(document.getElementById("app"),{childList:true,subtree:true});
onAuthStateChanged(auth,u=>{if(signingUp)return;if(u)start(u);else{started=false;loginForm()}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
